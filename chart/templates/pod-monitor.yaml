{{- if and .Values.web.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PodMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    <<: &selectorLabels
      app.kubernetes.io/name: quake3
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
    skaffold.dev/keep: "true"
  name: {{ .Release.Name }}
spec:
  selector:
    matchLabels: *selectorLabels
  podMetricsEndpoints:
    - port: gateway-health
      path: /metrics
      scheme: http
{{- end }}
