{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    <<: &selectorLabels
      app.kubernetes.io/name: quake3
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
    skaffold.dev/keep: "true"
spec:
  selector: *selectorLabels
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- end }}
