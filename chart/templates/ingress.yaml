{{- if .Values.web.enabled }}
{{- if .Values.ingress.tls.issuerRef }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}
  labels:
    skaffold.dev/keep: "true"
    app.kubernetes.io/name: quake3
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  {{- with .Values.ingress.tls.secretName }}
  secretName: {{ . | quote }}
  {{- end }}
  dnsNames:
    - {{ .Values.hostname | quote }}
  issuerRef:
    {{- toYaml .Values.ingress.tls.issuerRef | nindent 4 }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    skaffold.dev/keep: "true"
    app.kubernetes.io/name: quake3
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: http
  {{- $tlsSecret := .Values.ingress.tls.secretName | default "" }}
  {{- if and (not $tlsSecret) .Values.ingress.tls.issuerRef }}
  {{- $tlsSecret = printf "%s-tls" .Release.Name }}
  {{- end }}
  {{- with $tlsSecret }}
  tls:
    - hosts:
        - {{ $.Values.hostname | quote }}
      secretName: {{ . | quote }}
  {{- end }}
{{- end }}
