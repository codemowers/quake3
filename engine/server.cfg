// Compose uses separate network namespaces for the server and gateway.
set net_ip "0.0.0.0"
set net_ip6 "::"
net_restart
seta sv_hostname "Source-built Quake III"
seta sv_maxclients 20
seta sv_pure 0
// Remove abandoned clients even if a browser cannot send its disconnect.
seta sv_timeout 15
seta g_motd "Authenticated Quake III"
seta g_gametype 0
seta timelimit 10
seta fraglimit 20
map q3dm17
